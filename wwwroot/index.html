<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaterialSolution</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="MaterialSolution.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

<script>
    window.cachePdfsInBackground = async function (urls) {
        if (!('caches' in window)) return;

        try {
            const cache = await caches.open('pdf-cache-v1');
            for (let url of urls) {
                // Check if already cached
                const match = await cache.match(url);
                if (!match) {
                    console.log("Background pre-caching:", url);
                    await cache.add(url);
                }
            }
            console.log("All PDFs pre-cached successfully!");
        } catch (err) {
            console.warn("Background caching error (likely CORS or network):", err);
        }
    };
</script>

</html>
